name: portal

services:
  frontend:
    container_name: portal_frontend
    image: ${WEB_IMAGE:-ghcr.io/your-github-owner/satudatabulungan-web:deploy-latest}
    restart: unless-stopped
    env_file:
      - ../env/web.production.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    networks:
      - portal

networks:
  portal:
    driver: bridge
