name: Quality Gate

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  dual-mode-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INTERNAL_BASIC_AUTH_USER: admin
      INTERNAL_BASIC_AUTH_PASSWORD: bulungan123
      CKAN_BASE_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install app deps
        working-directory: web
        run: npm ci

      - name: Start CKAN stack
        working-directory: services/ckan
        run: docker compose up -d --force-recreate

      - name: Wait CKAN healthy
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            ckan_id="$(docker compose -f services/ckan/docker-compose.yml ps -q ckan || true)"
            status="$(docker inspect "$ckan_id" --format '{{.State.Health.Status}}' 2>/dev/null || true)"
            if [[ "$status" == "healthy" ]]; then
              echo "CKAN healthy"
              exit 0
            fi
            sleep 5
          done
          echo "CKAN failed to reach healthy state"
          docker compose -f services/ckan/docker-compose.yml ps
          docker compose -f services/ckan/docker-compose.yml logs ckan --tail 200 || true
          exit 1

      - name: CKAN connectivity check
        run: node scripts/test-ckan-connection.mjs http://localhost:5000

      - name: Seed sample CKAN data
        run: node scripts/seed-ckan-sample.mjs http://localhost:5000

      - name: Workflow API smoke gate
        run: node scripts/smoke-workflow-api.mjs

      - name: Reset seed sample CKAN data
        run: node scripts/seed-ckan-sample.mjs http://localhost:5000

      - name: Lint app
        working-directory: web
        run: npm run lint

      - name: Build app
        working-directory: web
        run: npm run build

      - name: Dual-mode smoke gate
        run: node scripts/smoke-dual-mode.mjs --skip-build

      - name: Stop CKAN stack
        if: always()
        working-directory: services/ckan
        run: docker compose down -v
